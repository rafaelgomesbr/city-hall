# =====================================================================
# Implantação do CONSOLE DO FORNECEDOR no Fly.
#
# APLICATIVO PRÓPRIO, separado de `defesa-civil`, porque a decisão 1 da ADR 0008
# pede outro processo com outro segredo e outra conexão. Dois processos no mesmo
# aplicativo do Fly compartilhariam a mesma lista de segredos, e aí bastaria um
# `fly secrets set DATABASE_URL=...` no lugar certo para o console passar a ter a
# credencial do produto. Com dois aplicativos, o console só alcança o que foi
# escrito no aplicativo do console.
#
# Este arquivo mora em `dc360/` pela mesma razão que o `fly.toml` da API: o
# contexto de build do Fly é a pasta do arquivo de configuração, e o
# `Dockerfile.console` faz `COPY package.json package-lock.json ./` na primeira
# etapa. Da raiz do `city-hall` esse COPY não acha nada e o build morre ali.
#
# O deploy roda daqui, e SEMPRE com `-c`, senão o `fly` pega o `fly.toml` da API
# e implanta a API por cima do console:
#   cd dc360 && fly deploy -c fly.console.toml
#
# ANTES DO PRIMEIRO DEPLOY, nesta ordem (o passo a passo com os comandos por
# extenso está em docs/IMPLANTACAO.md, seção 6):
#
#   1. `npm run migrar` com o papel dono do banco. O console recusa subir
#      contra um esquema que não tenha o que ele usa (`src/esquema.ts`), e hoje
#      isso significa pelo menos a migração 036.
#   2. CRIAR O PAPEL DE LOGIN DO CONSOLE. Este é o passo que não existe em
#      nenhum outro roteiro e que trava o deploy se ficar para depois:
#      `dc360_console` foi criado NOLOGIN na migração 023, de propósito, então
#      ele NÃO serve de usuário de string de conexão. A `CONSOLE_DATABASE_URL`
#      aponta para outro papel, com LOGIN, membro dele:
#
#        CREATE ROLE dc360_console_login LOGIN PASSWORD '...' NOSUPERUSER;
#        GRANT dc360_console TO dc360_console_login WITH SET TRUE;
#
#      O `WITH SET TRUE` não é enfeite: toda transação do console emite
#      `SET LOCAL ROLE dc360_console` (ver `apps/console/src/banco.ts`), e sem
#      ele o `SET ROLE` é recusado e TODA consulta falha. É o mesmo desenho de
#      `dc360_api` para `dc360_app`.
#   3. `fly secrets import` com o arquivo descrito abaixo. NUNCA
#      `fly secrets set` com aspas duplas; a razão está em SEGREDOS.
#
# SEGREDOS, e eles entram POR ARQUIVO:
#
#   fly secrets import -a defesa-civil-console < segredos-do-console.env
#
#   Com `fly secrets set CONSOLE_OPERADORES="..."`, quem lê o valor primeiro é o
#   SHELL, e ele expande `$131072`, `$8` e `$1` do hash de senha para vazio
#   antes de o `fly` receber qualquer coisa. O JSON continua válido, o esquema
#   continua passando, o envelope do segundo fator continua abrindo (ele é
#   base64 e não tem `$`), o processo SOBE normal, e a senha certa é recusada
#   para sempre, sem uma linha de log. `CONSOLE_JWT_SEGREDO` e
#   `CONSOLE_SEGUNDO_FATOR_CHAVE` correm o mesmo risco por serem base64 com
#   `+`, `/` e `=`. O `import` lê o arquivo linha a linha, sem shell no meio.
#
#   Desde 15/09/2026 a partida também RECUSA hash de senha que não tenha as seis
#   partes de `scrypt$N$r$p$sal$hash`, dizendo que a causa provável foram as
#   aspas. Com isso, um deploy feito pelo caminho errado FALHA em vez de subir
#   quebrado, e o release anterior continua atendendo.
#
#   CONSOLE_DATABASE_URL          papel de LOGIN do passo 2, nunca `dc360_app`
#                                 nem o `postgres` do Supabase, e ela PRECISA
#                                 terminar em `?sslmode=verify-full`. Exemplo:
#                                 postgres://dc360_console_login:SENHA@HOST:5432/postgres?sslmode=verify-full
#   CONSOLE_JWT_SEGREDO           >= 32 bytes, e DIFERENTE do JWT_SEGREDO da
#                                 API. A separação de verdade é a plateia do
#                                 token, mas dois valores iguais em dois
#                                 aplicativos é uma convenção que ninguém
#                                 confere.
#   CONSOLE_SEGUNDO_FATOR_CHAVE   32 bytes em base64, SEPARADA da
#                                 SEGUNDO_FATOR_CHAVE do produto
#   CONSOLE_OPERADORES            a linha que sai de
#                                 `npm run provisionar --workspace @dc360/console`
# =====================================================================

app = "defesa-civil-console"
primary_region = "gru"

# Quanto o Fly espera entre o SIGTERM e o SIGKILL, como no `fly.toml` da API.
# Aqui não há Chromium nem relógio: o encerramento é `app.close()` mais o pool
# de duas conexões (apps/console/src/index.ts). Mesmo assim 5 s é pouco para
# uma troca de senha no meio (uma passagem de scrypt de 128 MB numa máquina
# compartilhada leva perto de um segundo, e a requisição precisa terminar
# antes de o pool fechar). Quinze segundos cobrem isso com folga.
kill_timeout = 15

[build]
  dockerfile = "Dockerfile.console"

# Só o que NÃO é segredo.
[env]
  NODE_ENV = "production"
  # O CONTRATO DE AMBIENTE (V2-F01-E09). As duas linhas abaixo NÃO são segredo, e
  # a partida RECUSA subir sem elas (apps/console/src/config.ts). Matriz inteira
  # em scripts/ambientes.json, explicação em docs/AMBIENTES.md.
  #
  # AMBIENTE_DC360 diz a este processo onde ele está. CONSOLE_IDENTIDADE_DO_BANCO
  # é a referência do projeto do banco de PROD: o usuário ou o host da
  # CONSOLE_DATABASE_URL precisa contê-la, senão a partida recusa. É o que impede
  # um console de HML de subir com a credencial de PROD (e mostrar o número de
  # todos os municípios na tela de homologação).
  #
  # ANTES do primeiro deploy com estas linhas: conferir que a CONSOLE_DATABASE_URL
  # do Fly traz esta referência (o usuário é `dc360_console_login.<referência>`).
  # Se não trouxer, o deploy novo NÃO sobe e o release anterior segue atendendo.
  AMBIENTE_DC360 = "prod"
  CONSOLE_IDENTIDADE_DO_BANCO = "bppklrxxwjshxvkvwirw"
  # 0.0.0.0 porque num contêiner a porta publicada não atende em 127.0.0.1, e o
  # sintoma é um aplicativo de pé que não responde, sem erro em lugar nenhum.
  # Desde 15/09/2026 a partida em produção RECUSA um endereço de loopback, para
  # o defeito não voltar calado se alguém apagar esta linha.
  CONSOLE_HOST = "0.0.0.0"
  CONSOLE_PORT = "3344"

[http_service]
  internal_port = 3344
  force_https = true
  # O console NÃO hiberna, e a razão aqui é diferente da da API.
  #
  # Na API é porque sistema de emergência não pode esperar a partida. Aqui é
  # porque a partida do console não é instantânea (ela confere o esquema e o
  # envelope do dono no banco) e quem o abre é o dono do produto no meio de um
  # atendimento: esperar a máquina acordar para descobrir se um município está
  # usando o sistema não vale os centavos que a hibernação economiza.
  #
  # ATÉ A MIGRAÇÃO 038 havia uma segunda razão, de segurança: o teto de
  # tentativas do segundo fator e o passo do TOTP já queimado viviam na memória
  # do processo, e reiniciar devolvia ao atacante cinco tentativas novas. Desde
  # a 038 os dois vivem na LINHA do operador em `console_operadores`
  # (`falhas_login`, `bloqueado_ate`, `ultimo_passo_totp`; ver o cabeçalho de
  # `apps/console/src/operadores.ts`), e reiniciar não esquece nada.
  auto_stop_machines = 'off'
  auto_start_machines = true
  # UMA MÁQUINA, por economia, e não mais por segurança: com o teto e o passo
  # no banco, duas máquinas contam as mesmas cinco tentativas e recusam o mesmo
  # código já usado. Um punhado de pessoas do fornecedor olhando números não
  # paga duas máquinas.
  min_machines_running = 1
  processes = ["app"]

  # `/saude` do console responde apenas que o PROCESSO está de pé, e isto é uma
  # diferença real em relação ao `/saude` da API, que também confere o banco e o
  # esquema. Está escrito aqui para ninguém ler mais garantia do que existe:
  #
  #   - banco ausente ou esquema atrasado NA PARTIDA: o processo não sobe, a
  #     verificação falha por ausência de resposta, e o release é revertido.
  #     Este caso está coberto.
  #   - banco que cai DEPOIS de o processo estar de pé: a verificação continua
  #     verde e a tela passa a dar erro. Este caso NÃO está coberto, e cobri-lo
  #     é mudança em `apps/console/src/servidor.ts`.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    # Trinta segundos cobrem a conferência de esquema, que é uma ida ao banco
    # antes de o servidor começar a atender.
    grace_period = "30s"
    method = "GET"
    path = "/saude"

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB, e não o 1 GB da API: aqui não há Chromium. O que roda é um Fastify
  # com cinco rotas e um pool de duas conexões.
  memory = "512mb"
