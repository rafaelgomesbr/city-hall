<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DC, Defesa Civil 360">
  <!--
    A marca do Defesa Civil 360 como ícone: a mesma sigla "DC" da barra lateral
    do painel (.lateral__sigla em src/estilos/app.css), sobre o gradiente de
    marca, no raio do produto.

    Arquivo em public/ não lê tokens.css, então cada cor está escrita com o
    nome do token de src/estilos/tokens.css ao lado. Se um token mudar lá,
    mude aqui e rode: node scripts/gerar-marca.mjs (que regenera os PNG, o
    favicon.ico e a imagem Open Graph a partir deste arquivo e de og.svg).

    Valores do TEMA CLARO, de propósito: o ícone é um só para os dois temas, e
    violeta profundo com sigla branca é o que se lê melhor tanto na aba clara
    quanto na escura.

    A sigla é o contorno das letras em Work Sans Bold (700) convertido em
    caminho, com o mesmo espaçamento da lateral (letter-spacing 0.02em):
    favicon não carrega fonte de rede, e como caminho ela é idêntica em toda
    máquina.
  -->
  <defs>
    <!-- --ds-accent-gradient: linear-gradient(135deg, --ds-accent, --ds-accent-hover) -->
    <linearGradient id="marca-gradiente" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B21B6"/> <!-- --ds-accent = --ds-violet-700 -->
      <stop offset="1" stop-color="#4C1D95"/> <!-- --ds-accent-hover = --ds-violet-800 -->
    </linearGradient>
    <!-- --ds-accent-glow: --ds-violet-500 a 35%, esmaecendo até transparente -->
    <radialGradient id="marca-brilho" cx="0.22" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/> <!-- --ds-violet-500 -->
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/> <!-- --ds-violet-500 -->
    </radialGradient>
  </defs>
  <!--
    rx=102 é --ds-radius (8px) na proporção do emblema de 40px da lateral
    (--emblema-md): 512 * 8 / 40 = 102,4. O gerador zera este rx nas versões
    de fundo cheio (apple-touch-icon e ícone mascarável), porque ali quem
    recorta o canto é o sistema.
  -->
  <g id="fundo">
    <rect class="canto" width="512" height="512" rx="102" fill="url(#marca-gradiente)"/>
    <rect class="canto" width="512" height="512" rx="102" fill="url(#marca-brilho)"/>
  </g>
  <!-- Caixa da sigla: 331 x 170 px, centrada, dentro do círculo de 80% que o
       Android exige do mascarável. -->
  <g id="sigla" fill="#FFFFFF"> <!-- --ds-on-accent = --ds-white (tema claro) -->
    <path d="M90.63 173.50L160.63 173.50Q199.38 173.50 220 195Q240.63 216.50 240.63 256L240.63 256Q240.63 295.50 220 317Q199.38 338.50 160.63 338.50L160.63 338.50L90.63 338.50L90.63 173.50ZM133.63 306L156.38 306Q177.38 306 187 293.38Q196.63 280.75 196.63 256L196.63 256Q196.63 231.25 187 218.63Q177.38 206 156.38 206L156.38 206L133.63 206L133.63 306ZM382.38 280.25L421.38 291.25Q416.63 308.50 406.13 319.63Q395.63 330.75 381.13 335.88Q366.63 341 349.13 341L349.13 341Q324.13 341 305.88 330.88Q287.63 320.75 277.88 301.75Q268.13 282.75 268.13 256L268.13 256Q268.13 229.25 277.88 210.25Q287.63 191.25 305.88 181.13Q324.13 171 348.88 171L348.88 171Q366.13 171 380.63 175.88Q395.13 180.75 405.13 190.75Q415.13 200.75 419.38 216.50L419.38 216.50L381.63 231.75Q378.13 216.25 370.25 210.50Q362.38 204.75 350.38 204.75L350.38 204.75Q338.63 204.75 330 210.50Q321.38 216.25 316.75 227.63Q312.13 239 312.13 256L312.13 256Q312.13 272.75 316.38 284.25Q320.63 295.75 329.25 301.50Q337.88 307.25 350.63 307.25L350.63 307.25Q362.63 307.25 371 300.63Q379.38 294 382.38 280.25L382.38 280.25Z"/>
  </g>
</svg>
