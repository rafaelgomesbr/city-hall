# =====================================================================
# Implantação da API do DC360 no Fly.
#
# Este arquivo mora em `dc360/`, e não na raiz do repositório, de propósito:
# o contexto de build do Fly é a pasta do `fly.toml`, e o `Dockerfile` faz
# `COPY package.json package-lock.json ./` logo na primeira etapa. Da raiz
# do `city-hall` esse COPY não acha nada e o build morre ali.
#
# Ou seja, o deploy roda daqui:
#   cd dc360 && fly deploy -a defesa-civil
#
# Antes do primeiro deploy que precisa dar certo, na ordem:
#   1. `npm run migrar` com o papel `postgres` do Supabase (a API recusa
#      subir com esquema atrasado, ver apps/api/src/index.ts).
#   2. criar o papel `dc360_api` e o `GRANT dc360_app TO dc360_api`.
#   3. `fly secrets set` com o que está listado em SEGREDOS, abaixo.
# =====================================================================

app = "defesa-civil"
primary_region = "gru"

# Quanto o Fly espera entre o SIGTERM e o SIGKILL. O padrão é 5 s, e o
# encerramento desta API não cabe nisso com folga (ver os tratadores de sinal
# em apps/api/src/index.ts): `app.close()` espera a requisição em andamento
# terminar, os cinco relógios param um a um (varredura de push, minimização,
# resumo, órfão, eliminação, cada um esperando a rodada em curso), o Chromium
# do PDF é fechado e só então o pool do banco. Um laudo sendo renderizado no
# instante do deploy é um Chromium que leva segundos para sair. Com 5 s o Fly
# mata o processo no meio disso, e o que sobra é transação derrubada e um
# navegador zumbi que a máquina nova não sabe que existe. Trinta segundos é
# folga, e não custa nada quando o encerramento é rápido: o processo sai
# sozinho e o Fly só espera o tempo inteiro quando algo demora, que é
# exatamente o caso do Chromium. Não foi medido contra a produção; é teto de
# espera, não promessa de duração.
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

# Só o que NÃO é segredo. O resto entra por `fly secrets set`, que grava
# cifrado e nunca aparece no repositório nem no painel.
#
# SEGREDOS que precisam existir, senão o processo recusa subir (de propósito,
# ver a lista de checagens em apps/api/src/config.ts):
#   DATABASE_URL       papel dc360_api, NUNCA o postgres do Supabase, e ela
#                      PRECISA terminar em `?sslmode=verify-full`. A URL que o
#                      painel do Supabase oferece NÃO traz isso, e sem isso a
#                      conexão sobe cifrada e não autenticada: quem estiver
#                      entre o Fly e o banco lê e reescreve a base de todos os
#                      municípios. Desde 09/09/2026 a partida em produção
#                      RECUSA subir sem o parâmetro, em vez de subir calada.
#                      Exemplo:
#                        fly secrets set DATABASE_URL='postgres://dc360_api:SENHA@HOST:5432/postgres?sslmode=verify-full'
#   JWT_SEGREDO        >= 32 bytes
#   URL_PUBLICA        https, sem localhost
#   URL_PAINEL         https, sem localhost
#   ORIGENS_PERMITIDAS https, sem curinga
#   S3_ENDPOINT S3_BALDE S3_CHAVE_ID S3_CHAVE_SECRETA
[env]
  NODE_ENV = "production"
  # 0.0.0.0 porque num contêiner a porta publicada não atende em 127.0.0.1,
  # e o healthcheck mentiria que está de pé.
  HOST = "0.0.0.0"
  PORT = "3333"
  # Piloto sem provedor de email: a tela manda procurar quem administra o
  # município. Ligar sem NOTIFICADOR_URL derruba a partida.
  RECUPERACAO_ATIVA = "nao"
  # Só apague quando o município homologar e os documentos passarem a valer.
  MARCA_DAGUA = "DOCUMENTO DE VALIDAÇÃO"
  # O armazenamento é o do próprio Supabase, então a região é a real do
  # projeto, e não o "auto" que valeria no Cloudflare R2.
  S3_REGIAO = "sa-east-1"
  # De quem este processo aceita cabeçalho de origem. `fly` faz o servidor ler
  # `Fly-Client-IP`, e essa declaração PRECISA existir aqui, e não ser
  # adivinhada pelo código: o cabeçalho é posto pelo edge do Fly, mas fora do
  # Fly ele é só um cabeçalho que qualquer cliente escreve. Com o valor padrão
  # (`nenhum`), trinta tentativas de login com `Fly-Client-IP` diferente a cada
  # uma davam ZERO recusas, e o endereço gravado na trilha como autor da
  # exportação da base de cidadãos era escolhido por quem exportava.
  # Trocar de PaaS (Railway, Render) significa VOLTAR isto para `nenhum`.
  PROXY_DE_BORDA = "fly"
  # O PUSH. As três linhas abaixo NÃO são segredo e podem viver aqui; os
  # três segredos (APNS_KEY_ID, APNS_TEAM_ID, APNS_CHAVE) vão por
  # `fly secrets set`. Roteiro inteiro em docs/IMPLANTACAO.md, "Ligar o push".
  #
  # PUSH_ATIVO fica COMENTADO até os segredos existirem: com `sim` e sem as
  # APNS_* a partida cai, de propósito, e o release anterior continua no ar.
  # A ordem é: (1) `fly secrets set` com os três, (2) descomentar a linha,
  # (3) `fly deploy`. Nunca o contrário.
  # PUSH_ATIVO = "sim"
  # `producao` é o padrão de quem registra sem dizer o ambiente (aplicativo
  # antigo). O binário do Xcode e o da loja convivem: cada aparelho diz o
  # seu no registro (migração 044).
  APNS_AMBIENTE = "producao"
  # O bundle do aplicativo, o mesmo de `apps/campo/app.config.ts`
  # (`ios.bundleIdentifier`). Vira o `apns-topic`; errado, a Apple responde
  # TopicDisallowed em toda notificação.
  APNS_BUNDLE = "com.solerte.dc360.campo"

[http_service]
  internal_port = 3333
  force_https = true
  # Sistema de emergência não hiberna. O padrão do Fly é parar a máquina sem
  # tráfego, e o custo disso seria a ocorrência das 3h esperando a partida,
  # que aqui não é instantânea: o processo confere o esquema no banco antes
  # de atender.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # `/saude` responde 503 enquanto o banco não responde ou o esquema está
  # atrasado, então o balanceador não manda tráfego para um processo que
  # ainda não pode servir. É rota pública e não vaza detalhe de erro.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/saude"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB, e não 256 MB, por causa do Chromium que a imagem instala para o
  # PDF. Se a decisão pendente no topo do Dockerfile for tirar o PDF da
  # imagem, isto cai para 512 MB e a imagem encolhe algumas centenas de MB.
  memory = "1gb"
