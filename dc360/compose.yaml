# =====================================================================
# Ambiente completo para desenvolvimento e para conferir um deploy.
#
# NÃO FOI EXECUTADO: o ambiente onde este arquivo foi escrito não tem
# Docker. É proposta revisável, não receita comprovada.
#
# O serviço `migrar` roda uma vez, antes da API, e a API só sobe depois
# que ele termina com sucesso. É isso que evita dois processos migrando
# em paralelo num deploy com mais de uma réplica.
# =====================================================================
services:
  banco:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: dc360
      POSTGRES_USER: dc360_dono
      # Só para o ambiente local. Em produção vem do gerenciador de segredos.
      POSTGRES_PASSWORD: senha-local-de-desenvolvimento
    ports: ["5432:5432"]
    volumes: ["dados-do-banco:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dc360_dono -d dc360"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrar:
    build: { context: ., dockerfile: Dockerfile }
    command: ["node", "db/dist/cli.js"]
    environment:
      DATABASE_URL: postgres://dc360_dono:senha-local-de-desenvolvimento@banco:5432/dc360
    depends_on:
      banco: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://dc360_dono:senha-local-de-desenvolvimento@banco:5432/dc360
      # Em produção estes três vêm do gerenciador de segredos, nunca do arquivo.
      JWT_SEGREDO: troque-por-pelo-menos-trinta-e-dois-bytes-reais
      ORIGENS_PERMITIDAS: http://localhost:5173
      URL_PUBLICA: http://localhost:3333
      URL_PAINEL: http://localhost:5173
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BALDE: ${S3_BALDE:-}
      S3_CHAVE_ID: ${S3_CHAVE_ID:-}
      S3_CHAVE_SECRETA: ${S3_CHAVE_SECRETA:-}
    ports: ["3333:3333"]
    depends_on:
      banco: { condition: service_healthy }
      migrar: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3333/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  dados-do-banco:
