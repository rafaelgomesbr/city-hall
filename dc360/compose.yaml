# =====================================================================
# Ambiente local: sobe banco, aplica migrações, cria os papéis e serve a API.
#
# NUNCA FOI EXECUTADO E NADA NO REPOSITÓRIO O PROVA. As correções abaixo vêm
# da auditoria (NODE_ENV, HOST, papéis) e da partida provada À MÃO contra um
# PostgreSQL 18 real, sem Docker, que é o que garante que a API sobe. A
# integração contínua NÃO usa este arquivo nem constrói a imagem: o job
# `implantavel` sobe a API direto no Node, contra um Postgres 16 de serviço
# (trocar isso por 17 é assunto da V2-F01-E08).
#
# POSTGRES 17 (V2-F01-E09): a produção roda 17.6, e o compose rodava 16. Um
# comportamento que muda entre as duas majors só aparecia depois do deploy. A
# imagem é `postgis/postgis:17-3.5` (PostGIS 3.5 sobre Postgres 17). Trocar a
# tag NÃO foi executado aqui: esta máquina não tem Docker, então a subida do
# compose com a imagem nova continua sem registro de execução.
# Construir e subir uma vez antes do primeiro deploy continua sendo
# obrigatório; o CI que constrói a imagem é a V2-F01-E08.
#
# ESTE COMPOSE É PARA DESENVOLVER E PARA CONFERIR QUE A IMAGEM SOBE, não para
# produção. Produção usa Postgres gerenciado (com backup e PITR) e um proxy
# reverso terminando TLS na frente da API. Ver o README, seção Implantação.
#
# O modelo de três papéis do README está reproduzido aqui: `banco` cria o
# superusuário local (papel de setup, com CREATEROLE e BYPASSRLS); `migrar`
# aplica o esquema com ele; `papeis` cria o login de aplicação e o torna
# membro de dc360_app; e a `api` conecta com esse login restrito, nunca com o
# de setup.
# =====================================================================
services:
  banco:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: dc360
      # O usuário inicial do POSTGRES_USER é superusuário: é o papel de SETUP
      # (tem CREATEROLE e BYPASSRLS, que a migração 001 e as funções de
      # autenticação SECURITY DEFINER exigem). Só para o ambiente local.
      POSTGRES_USER: dc360_setup
      POSTGRES_PASSWORD: senha-local-de-desenvolvimento
    ports: ["5432:5432"]
    volumes: ["dados-do-banco:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dc360_setup -d dc360"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrar:
    build: { context: ., dockerfile: Dockerfile }
    command: ["node", "db/dist/cli.js"]
    environment:
      # Migra com o papel de setup: a migração 001 cria o papel dc360_app.
      DATABASE_URL: postgres://dc360_setup:senha-local-de-desenvolvimento@banco:5432/dc360
    depends_on:
      banco: { condition: service_healthy }
    restart: "no"

  # Cria o login de aplicação e o torna membro de dc360_app COM SET. Roda
  # depois do migrar (o papel dc360_app nasce lá) e antes da API. Idempotente:
  # subir de novo não falha se o papel já existir.
  papeis:
    image: postgis/postgis:17-3.5
    entrypoint: ["bash", "-c"]
    command:
      - |
        export PGPASSWORD=senha-local-de-desenvolvimento
        psql -h banco -U dc360_setup -d dc360 -v ON_ERROR_STOP=1 -c "
          DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='dc360_api') THEN
              CREATE ROLE dc360_api LOGIN PASSWORD 'senha-app-local' NOSUPERUSER;
            END IF;
          END \$\$;
          GRANT dc360_app TO dc360_api WITH SET TRUE;
        "
    depends_on:
      migrar: { condition: service_completed_successfully }
    restart: "no"

  api:
    build: { context: ., dockerfile: Dockerfile }
    environment:
      # development, e não production: este compose não tem TLS nem S3, e o
      # config.ts recusa produção sem HTTPS e sem armazenamento. Produção sobe
      # em PaaS gerenciada, não aqui.
      NODE_ENV: development
      # O contrato de ambiente (V2-F01-E09): esta é a máquina de quem
      # desenvolve. HML e PROD não sobem por aqui.
      AMBIENTE_DC360: dev
      # 0.0.0.0, senão a API escuta só o loopback DENTRO do contêiner e a porta
      # publicada não atende ninguém, com o healthcheck mentindo que está de pé.
      HOST: 0.0.0.0
      # A API conecta com o papel de APLICAÇÃO, restrito, nunca com o de setup.
      DATABASE_URL: postgres://dc360_api:senha-app-local@banco:5432/dc360
      JWT_SEGREDO: troque-por-pelo-menos-trinta-e-dois-bytes-reais
    ports: ["3333:3333"]
    depends_on:
      banco: { condition: service_healthy }
      migrar: { condition: service_completed_successfully }
      papeis: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3333/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  dados-do-banco:
