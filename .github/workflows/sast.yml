# SAST do DC360 com Semgrep CE (V2-F01-E05).
#
# O que ele impõe, e por quê:
#
# - As regras próprias protegem o que o produto tem de mais caro. A organização
#   nunca é lida da requisição (regra número um, isolamento entre municípios), SQL
#   não é montado por interpolação e o cabeçalho Authorization não vai para log.
#   Ficam em `.semgrep/regras/`, com casos positivos e negativos em
#   `.semgrep/test/`, rodados por `semgrep --test` ANTES da varredura: regra que
#   não passa no próprio teste não tem autoridade para reprovar um PR.
# - As regras do registro (TypeScript, Node, React e JWT) TAMBÉM bloqueiam, mas
#   fixadas: vêm de um commit exato de `semgrep/semgrep-rules` (SEMGREP_RULES_SHA,
#   conferido por `git rev-parse` depois do download), nunca dos pacotes móveis
#   `p/...`, que mudam sem aviso. ERROR novo reprova pelo mesmo mecanismo de baseline
#   das regras próprias (`.semgrep/baseline-registro.json`). O repositório é público
#   e essas regras são da Semgrep Rules License v1.0 (uso interno, sem
#   redistribuição): são baixadas no runner, e nenhuma cópia delas mora aqui.
#   (Correção 1 da F01: antes rodavam num passo com `continue-on-error`/`|| true`.)
# - Nenhum código sai do runner: versão fixa do Semgrep (e das dependências dele,
#   por hash, em `.semgrep/requirements.txt`), `--metrics=off`, sem login,
#   sem token (`SEMGREP_APP_TOKEN` não existe aqui e o teste de política reprova se
#   aparecer). O passo do registro só BAIXA regras.
# - Só achado NOVO de severidade ERROR reprova. Achado antigo mora na baseline
#   triada (`.semgrep/baseline.json`), em que cada linha foi lida por uma pessoa e
#   tem classe, motivo, dono e prazo; defeito real vira trabalho de V2-F25-E01.
#   Quem decide é `dc360/scripts/sast-baseline.mjs`, e não o código de saída do
#   Semgrep, que só falha se a própria análise quebrar.
# - Exceção pontual é `nosemgrep: <regra> -- motivo: ...; dono: ...; ate: AAAA-MM-DD`,
#   e vencida reprova (`dc360/scripts/excecoes-de-seguranca.test.mjs`, que roda no
#   job `produto` do verificar.yml por `npm run test:scripts`).
#
# O nome do job é contrato com o ruleset do GitHub (check obrigatório): quem
# renomeia precisa atualizar a regra do ruleset.
name: SAST

on:
  push:
    branches: [main, master, "v2/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Em pull_request, uma execução nova substitui a antiga do mesmo ramo. Em push cada
# SHA tem a sua, e nenhuma é cancelada: o gatekeeper lê o run do SHA candidato.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Versão fixa. Subir a versão é um PR próprio, com a baseline refeita.
      SEMGREP_VERSION: "1.136.0"
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
      PYTHONWARNINGS: "ignore"
      # Regras do registro: commit fixo de semgrep/semgrep-rules (develop em 2026-10-21)
      # e as pastas usadas, no lugar dos pacotes móveis p/typescript, p/nodejs,
      # p/react e p/jwt. Ver o passo "Baixar as regras do registro".
      SEMGREP_RULES_SHA: "16b9e6d45f10649f6a531ec4838ed9924372c3bc"
      SEMGREP_RULES_PASTAS: >-
        typescript/lang typescript/react javascript/lang javascript/express
        javascript/node-crypto javascript/audit javascript/jsonwebtoken javascript/jose
        javascript/jwt-simple javascript/passport-jwt javascript/react
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 3.11: o semgrep 1.136.0 importa pkg_resources (via opentelemetry), que o
          # setuptools novo, instalado sozinho no 3.12, já não traz.
          python-version: "3.11"

      # Todas as distribuições (o Semgrep e as 45 transitivas) vêm de
      # `.semgrep/requirements.txt` com SHA-256 de cada arquivo, e o pip recusa
      # qualquer arquivo cujo hash não bata (`--require-hashes`). `--no-deps` porque
      # o arquivo já traz a árvore inteira; `--only-binary=:all:` porque compilar
      # sdist rodaria código de build sem hash. Como o arquivo é gerado (ver o
      # cabeçalho dele e `.semgrep/requirements.in`), subir a versão é um PR próprio.
      - name: Instalar o Semgrep CE e as dependências por hash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: -r .semgrep/requirements.txt
          semgrep --version | grep -Fx "${SEMGREP_VERSION}"

      - name: Regras próprias passam nos próprios testes
        run: |
          mkdir -p sast-artefatos
          set -o pipefail
          semgrep --test --metrics=off --disable-version-check \
            --config .semgrep/regras .semgrep/test 2>&1 | tee sast-artefatos/01-semgrep-test.txt

      - name: Varredura do produto
        run: |
          set -o pipefail
          semgrep scan --metrics=off --disable-version-check \
            --config .semgrep/regras \
            --json --output sast-artefatos/semgrep.json \
            dc360 2>&1 | tee sast-artefatos/02-semgrep-scan.txt

      - name: Achado novo reprova, achado antigo fica na baseline triada
        run: |
          set -o pipefail
          node dc360/scripts/sast-baseline.mjs conferir sast-artefatos/semgrep.json 2>&1 \
            | tee sast-artefatos/03-baseline.txt

      # As regras do registro (TypeScript, Node, React e JWT) rodam FIXADAS num
      # commit de `semgrep/semgrep-rules` (SEMGREP_RULES_SHA), baixado na hora e
      # conferido por `git rev-parse`. Os pacotes `p/...` do registro são
      # móveis (mudam sem aviso, sem versão), por isso não servem de portão: este
      # commit é a versão fixa. É USO, não redistribuição: nenhuma cópia das regras
      # mora no repositório (Semgrep Rules License v1.0, repositório público).
      # Subir o commit é um PR próprio, com a baseline do registro refeita.
      - name: Baixar as regras do registro no commit fixado
        run: |
          set -euo pipefail
          git init --quiet "${RUNNER_TEMP}/semgrep-rules"
          cd "${RUNNER_TEMP}/semgrep-rules"
          git remote add origin https://github.com/semgrep/semgrep-rules.git
          git fetch --quiet --depth 1 origin "${SEMGREP_RULES_SHA}"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SEMGREP_RULES_SHA}"
          for pasta in ${SEMGREP_RULES_PASTAS}; do test -d "${pasta}"; done
          echo "regras do registro em ${SEMGREP_RULES_SHA}" | tee "${GITHUB_WORKSPACE}/sast-artefatos/04-registro-versao.txt"

      # BLOQUEIA, pelo mesmo mecanismo de baseline das regras próprias: ERROR novo
      # do registro reprova, o que já existia está em `.semgrep/baseline-registro.json`
      # (triado, com classe, motivo, dono e prazo). Sem `continue-on-error`, sem `|| true`.
      - name: Varredura com as regras do registro fixadas
        run: |
          set -euo pipefail
          configs=()
          for pasta in ${SEMGREP_RULES_PASTAS}; do configs+=(--config "${RUNNER_TEMP}/semgrep-rules/${pasta}"); done
          semgrep scan --metrics=off --disable-version-check \
            "${configs[@]}" \
            --json --output sast-artefatos/04-registro.json \
            dc360 2>&1 | tee sast-artefatos/04-registro-scan.txt

      - name: Achado novo do registro reprova, o antigo fica na baseline triada
        run: |
          set -o pipefail
          node dc360/scripts/sast-baseline.mjs conferir --baseline .semgrep/baseline-registro.json sast-artefatos/04-registro.json 2>&1 \
            | tee sast-artefatos/05-baseline-registro.txt

      - name: Publicar a saída
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sast-${{ github.sha }}
          path: sast-artefatos/
          retention-days: 30
          if-no-files-found: warn
