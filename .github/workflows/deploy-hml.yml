# Deploy de HOMOLOGAÇÃO por merge na master (V2-F01-E12).
#
# O QUE FAZ
#
# Quando o `Verificar` de um push na `master` termina VERDE, constrói as duas
# imagens (API e console) UMA vez, copia as imagens para o registro do Fly de HML
# POR DIGEST, ensaia a migration no banco de HML, implanta API e console e confere
# `/saude` com a `versao` e o `commit` esperados. Depois move o ramo `homologacao`
# (de onde a Vercel publica o painel de HML) e, só então, marca a imagem como
# aprovada em HML. Esse selo (`hml-ok-<sha>`) é a prova que a promoção para PROD
# (`promover-producao.yml`) exige.
#
# POR QUE `workflow_run` E NÃO `push`
#
# `push` dispararia o deploy em paralelo com o CI, e a Vercel/Fly publicariam
# código que o CI ainda ia reprovar. `workflow_run` espera o `Verificar` terminar
# e deixa o deploy ler `conclusion`. Como `workflow_run` roda com os segredos do
# ambiente, o `if:` do job é a trava: só vale para PUSH na `master` deste mesmo
# repositório (nunca pull_request, nunca fork), com o CI verde. O código que roda
# é o `head_sha` daquele push, não o da ponta do ramo no momento.
#
# O CAMINHO ÚNICO
#
# Este workflow e `promover-producao.yml` são os únicos caminhos de implantação
# automatizados. `fly deploy` na máquina do dono continua possível em emergência
# (docs/runbooks/deploy.md), mas deixa de ser o caminho normal.
#
# SEGREDOS (todos do AMBIENTE `homologacao`, nunca do repositório)
#
#   FLY_TOKEN_API              token de deploy do app de API de HML, SÓ dele
#   FLY_TOKEN_CONSOLE          token de deploy do app de console de HML, SÓ dele
#   DC360_SENHA_BANCO_HML      senha do papel de setup do banco de HML (dado sintético)
#
# Nenhum token de PROD entra aqui, e nenhum token de HML entra em
# `promover-producao.yml`: o teste `scripts/conferir-workflows.test.mjs` confere os
# dois lados. Token de deploy de um app não deploya em outro: é a segunda trava.
#
# PERMISSÕES: o topo só lê. Escrita é declarada no job que precisa e o teste a
# trava por job: `construir` escreve pacotes (publica a imagem no GHCR) e
# `painel` escreve conteúdo (move o ramo `homologacao`). `aprovar` escreve
# pacotes para pôr o selo. `construir` também escreve `id-token` e `attestations`
# para a atestação de proveniência das imagens (correção da revisão 1 da F01).
#
# O QUE DEPENDE DE UMA PESSOA (e por isso este arquivo ainda não foi executado)
#
# O ambiente de HML (apps no Fly, projeto de banco) depende do CP-05, e os
# ambientes `homologacao` e `producao` do GitHub, os tokens e o projeto de painel
# de HML na Vercel são criados pelo Rafael. Roteiro em docs/IMPLANTACAO.md.
# Enquanto os marcadores de `fly.hml.toml` não são trocados, a partida de HML
# recusa subir de propósito (E11) e o job `implantar` falha na conferência.
#
# VERSÃO FIXA DO flyctl: não há ação de terceiro. O binário vem do release
# oficial, com SHA-256 conferido. Subir a versão é trocar FLYCTL_VERSAO e
# FLYCTL_SHA256 juntos, aqui e em `promover-producao.yml` (o teste exige que os
# dois arquivos concordem), com o hash de `flyctl_<versão>_checksums.txt`.

name: Implantar HML
# O SHA IMPLANTADO fica no título do run. Num `workflow_run`, o `head_sha` do run
# é a ponta do ramo padrão, e não o commit que este deploy implanta (o do
# Verificar que o disparou): se o CI de A termina depois de B entrar na master,
# o run que implanta A tem `head_sha` de B. A promoção para PROD procura o run
# por este título (correção 1 da F01, achado 4 da revisão independente).
run-name: Implantar HML ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Verificar"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

# Um deploy de cada vez, e nenhum cancelado no meio: cancelar um `fly deploy`
# pela metade deixa o app numa troca incompleta. O que chega enquanto um roda
# espera; se chegarem vários, só o mais novo espera.
concurrency:
  group: deploy-hml
  cancel-in-progress: false

env:
  FLYCTL_VERSAO: "0.4.115"
  # SHA-256 de flyctl_0.4.115_Linux_x86_64.tar.gz, igual ao de
  # flyctl_0.4.115_checksums.txt do release oficial.
  FLYCTL_SHA256: "8b99a37a546c6c5b3ecb10c0c1d962c62b1cda328934f17c55180281cbdeb72f"
  # Os apps de HML. Têm de ser os de `fly.hml.toml` e `fly.console.hml.toml`
  # (o teste confere) e NUNCA os de PROD.
  APP_API: defesa-civil-hml
  APP_CONSOLE: defesa-civil-console-hml
  # O projeto da Vercel que publica o painel de HML do ramo `homologacao`. O job
  # `painel` espera o deployment do commit neste projeto ficar `Ready` antes do
  # selo. Criado pelo dono (docs/runbooks/deploy.md); se o nome for outro, troca
  # aqui.
  PAINEL_HML_PROJETO_VERCEL: dc360-painel-hml

jobs:
  construir:
    name: Construir as imagens (uma vez)
    # Trava de segurança: só push na master deste repositório, com o CI verde.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # `id-token` e `attestations` são as duas escritas novas da correção da
    # revisão 1 da F01: a ação de proveniência assina (OIDC) e registra a
    # atestação de cada imagem, e a promoção para PROD verifica que o digest foi
    # construído por ESTE workflow (`gh attestation verify --signer-workflow`).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      versao: ${{ steps.carimbo.outputs.versao }}
      commit: ${{ steps.carimbo.outputs.commit }}
      imagem_api: ${{ steps.publicar.outputs.imagem_api }}
      imagem_console: ${{ steps.publicar.outputs.imagem_console }}
      digest_api: ${{ steps.publicar.outputs.digest_api }}
      digest_console: ${{ steps.publicar.outputs.digest_console }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # O carimbo é o do commit que o CI aprovou. `versao.mjs conferir` reprova se
      # os arquivos de versão discordam entre si.
      - name: Carimbo de versão e commit
        id: carimbo
        working-directory: dc360
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node scripts/versao.mjs conferir
          versao="$(node scripts/versao.mjs mostrar | awk '/^plataforma:/ {print $2}')"
          [[ "$versao" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "versão inválida: $versao"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit inválido"; exit 1; }
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Entrar no GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # As duas imagens saem do MESMO commit, com o carimbo como argumento de
      # build. O digest é lido do registro depois do push: é ele, e não a tag,
      # que o deploy e a promoção usam, e é ele que `/saude` prova depois.
      - name: Construir e publicar API e console
        id: publicar
        env:
          VERSAO: ${{ steps.carimbo.outputs.versao }}
          COMMIT: ${{ steps.carimbo.outputs.commit }}
        run: |
          set -euo pipefail
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          for alvo in api console; do
            if [ "$alvo" = api ]; then dockerfile=dc360/Dockerfile; else dockerfile=dc360/Dockerfile.console; fi
            imagem="$base/dc360-$alvo"
            docker build \
              -f "$dockerfile" \
              --build-arg "DC360_VERSAO=$VERSAO" \
              --build-arg "DC360_COMMIT=$COMMIT" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=$COMMIT" \
              --label "org.opencontainers.image.version=$VERSAO" \
              -t "$imagem:sha-$COMMIT" \
              dc360
            docker push "$imagem:sha-$COMMIT"
            digest="$(docker buildx imagetools inspect "$imagem:sha-$COMMIT" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest inválido para $alvo"; exit 1; }
            echo "imagem_$alvo=$imagem" >> "$GITHUB_OUTPUT"
            echo "digest_$alvo=$digest" >> "$GITHUB_OUTPUT"
            echo "$alvo: $imagem@$digest"
          done

      # Proveniência assinada do digest de cada imagem. É o que impede que uma
      # tag `hml-ok-` posta à mão, ou um digest que não saiu deste workflow,
      # passe pela promoção para PROD.
      - name: Atestar a proveniência da imagem da API
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.publicar.outputs.imagem_api }}
          subject-digest: ${{ steps.publicar.outputs.digest_api }}
          push-to-registry: true

      - name: Atestar a proveniência da imagem do console
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.publicar.outputs.imagem_console }}
          subject-digest: ${{ steps.publicar.outputs.digest_console }}
          push-to-registry: true

  implantar:
    name: Migrar e implantar API e console em HML
    needs: construir
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # O ambiente carrega os três segredos de HML e é a trava de quem pode
    # implantar. Restringir o ambiente ao ramo `master` é ato do dono.
    environment: homologacao
    permissions:
      contents: read
      packages: read
    env:
      VERSAO: ${{ needs.construir.outputs.versao }}
      COMMIT: ${{ needs.construir.outputs.commit }}
      IMAGEM_API: ${{ needs.construir.outputs.imagem_api }}
      IMAGEM_CONSOLE: ${{ needs.construir.outputs.imagem_console }}
      DIGEST_API: ${{ needs.construir.outputs.digest_api }}
      DIGEST_CONSOLE: ${{ needs.construir.outputs.digest_console }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dc360/package-lock.json

      - name: Instalar o flyctl (versão fixa, SHA-256 conferido)
        run: |
          set -euo pipefail
          arquivo="flyctl_${FLYCTL_VERSAO}_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${arquivo}" \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSAO}/${arquivo}"
          echo "${FLYCTL_SHA256}  ${RUNNER_TEMP}/${arquivo}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/flyctl"
          tar -xzf "${RUNNER_TEMP}/${arquivo}" -C "${RUNNER_TEMP}/flyctl" flyctl
          echo "${RUNNER_TEMP}/flyctl" >> "$GITHUB_PATH"

      # O cliente do runner é o 16 e o servidor é 17: `pg_dump` mais velho que o
      # servidor recusa (e recusa certo). Mesmo passo do job `restore`.
      - name: Instalar o cliente PostgreSQL 17
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Instalar as dependências do produto
        working-directory: dc360
        run: |
          npm ci --ignore-scripts
          npm run build:shared

      # Os apps têm de ser os de HML. Se alguém trocar o nome por um de PROD, o
      # job para aqui, antes de qualquer segredo ser usado.
      - name: Conferir que os alvos são de HML
        working-directory: dc360
        run: |
          set -euo pipefail
          grep -qx "app = \"${APP_API}\"" fly.hml.toml
          grep -qx "app = \"${APP_CONSOLE}\"" fly.console.hml.toml
          grep -Eq '^[[:space:]]*AMBIENTE_DC360 = "hml"' fly.hml.toml
          case "$APP_API $APP_CONSOLE" in *hml*hml*) ;; *) echo "alvo que não é de HML"; exit 1 ;; esac

      # Migration ANTES do código, sempre. Cópia do banco de HML primeiro (o
      # migrador recusa aplicar sem cópia recente do mesmo ambiente), depois
      # `--aplicar`. Em HML o dono do banco é dado sintético: a credencial pode
      # estar no ambiente. Em PROD ela NÃO entra em CI (ADR 0008).
      - name: Copiar o banco de HML e aplicar as migrations
        working-directory: dc360
        env:
          DC360_SENHA_BANCO_HML: ${{ secrets.DC360_SENHA_BANCO_HML }}
          DC360_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: |
          set -euo pipefail
          node scripts/copiar-producao.mjs --ambiente hml
          node scripts/migrar-producao.mjs --ambiente hml --aplicar
          node scripts/migrar-producao.mjs --ambiente hml

      - name: Entrar no GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # A MESMA imagem, copiada por digest para o registro do app de HML. O
      # `imagetools create --prefer-index=false` faz cópia CARBONO do manifesto,
      # sem reconstruir nada. Sem a opção, uma fonte só com manifesto simples vira
      # um índice novo, com OUTRO digest, e o `--image ...@digest` abaixo não
      # existiria no Fly (correção 1 da F01, achado 3). O digest do destino é
      # lido de volta e comparado. Depois do `fly deploy`, o `/saude` com o commit
      # esperado prova que foi essa imagem que subiu.
      - name: Implantar a API
        working-directory: dc360
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_API }}
        run: |
          set -euo pipefail
          printf '%s' "$FLY_API_TOKEN" | docker login registry.fly.io -u x --password-stdin
          docker buildx imagetools create --tag "registry.fly.io/${APP_API}:sha-${COMMIT}" --prefer-index=false "${IMAGEM_API}@${DIGEST_API}"
          copiado="$(docker buildx imagetools inspect "registry.fly.io/${APP_API}:sha-${COMMIT}" --format '{{.Manifest.Digest}}')"
          [ "$copiado" = "$DIGEST_API" ] || { echo "::error::a cópia da API no Fly tem o digest ${copiado}, e não o construído ${DIGEST_API}"; exit 1; }
          flyctl deploy -c fly.hml.toml -a "$APP_API" --image "registry.fly.io/${APP_API}@${DIGEST_API}"
          node scripts/conferir-saude-remota.mjs --tipo=api --url="https://${APP_API}.fly.dev" --versao="$VERSAO" --commit="$COMMIT"

      - name: Implantar o console
        working-directory: dc360
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_CONSOLE }}
        run: |
          set -euo pipefail
          printf '%s' "$FLY_API_TOKEN" | docker login registry.fly.io -u x --password-stdin
          docker buildx imagetools create --tag "registry.fly.io/${APP_CONSOLE}:sha-${COMMIT}" --prefer-index=false "${IMAGEM_CONSOLE}@${DIGEST_CONSOLE}"
          copiado="$(docker buildx imagetools inspect "registry.fly.io/${APP_CONSOLE}:sha-${COMMIT}" --format '{{.Manifest.Digest}}')"
          [ "$copiado" = "$DIGEST_CONSOLE" ] || { echo "::error::a cópia do console no Fly tem o digest ${copiado}, e não o construído ${DIGEST_CONSOLE}"; exit 1; }
          flyctl deploy -c fly.console.hml.toml -a "$APP_CONSOLE" --ha=false --image "registry.fly.io/${APP_CONSOLE}@${DIGEST_CONSOLE}"
          node scripts/conferir-saude-remota.mjs --tipo=console --url="https://${APP_CONSOLE}.fly.dev" --versao="$VERSAO" --commit="$COMMIT"

      - name: Sair dos registros
        if: always()
        run: |
          docker logout registry.fly.io || true
          docker logout ghcr.io || true

  # O painel de HML é publicado pela Vercel a partir do ramo `homologacao`, e
  # só DEPOIS da API e do console: o painel novo não pode chegar antes da API
  # nova. O token deste job escreve o ramo e LÊ os deployments; a Vercel não tem
  # token aqui.
  #
  # O job só termina verde depois de a Vercel publicar (correção 1 da F01,
  # achado 5 da revisão independente): antes, ele terminava quando o ramo se
  # movia, e uma falha de build na Vercel deixava o selo nascer assim mesmo.
  # `esperar-painel.mjs` lê, pela API do GitHub, o deployment que a integração
  # da Vercel registra para o commit no projeto de HML, espera o estado `Ready`
  # (`success`) e confere que o endereço de HML (`scripts/ambientes.json`)
  # responde. Falha, erro ou tempo esgotado reprovam com a razão escrita.
  painel:
    name: Publicar o painel de HML (ramo homologacao)
    needs: [construir, implantar]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Mover o ramo homologacao para o commit implantado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ needs.construir.outputs.commit }}
        run: |
          set -euo pipefail
          # Atualiza o ramo (com force, porque promover uma versão mais antiga
          # não é avanço rápido) ou o cria na primeira vez.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/homologacao" -f sha="$COMMIT" -F force=true \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/homologacao" -f sha="$COMMIT"

      - name: Esperar a Vercel publicar o painel de HML
        working-directory: dc360
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ needs.construir.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/esperar-painel.mjs --ambiente=hml --projeto="$PAINEL_HML_PROJETO_VERCEL" --commit="$COMMIT" --limite-min=15

  # O selo de "passou por HML". A promoção para PROD só aceita um commit cujas
  # duas imagens tenham este selo, e o selo só nasce depois do /saude verde da
  # API e do console e do painel publicado e respondendo.
  #
  # Cópia CARBONO (`--prefer-index=false`), e o digest do selo lido de volta e
  # comparado com o construído: sem isso, uma imagem de manifesto simples virava
  # um índice novo, o selo tinha outro digest e a promoção recusava a versão que
  # acabou de passar por HML (correção 1 da F01, achado 3).
  aprovar:
    name: Marcar a versão como aprovada em HML
    needs: [construir, implantar, painel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Pôr o selo hml-ok nas duas imagens
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ needs.construir.outputs.commit }}
          IMAGEM_API: ${{ needs.construir.outputs.imagem_api }}
          IMAGEM_CONSOLE: ${{ needs.construir.outputs.imagem_console }}
          DIGEST_API: ${{ needs.construir.outputs.digest_api }}
          DIGEST_CONSOLE: ${{ needs.construir.outputs.digest_console }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for alvo in API CONSOLE; do
            variavel_imagem="IMAGEM_${alvo}"
            variavel_digest="DIGEST_${alvo}"
            imagem="${!variavel_imagem}"
            digest="${!variavel_digest}"
            docker buildx imagetools create --tag "$imagem:hml-ok-$COMMIT" --prefer-index=false "$imagem@$digest"
            selado="$(docker buildx imagetools inspect "$imagem:hml-ok-$COMMIT" --format '{{.Manifest.Digest}}')"
            [ "$selado" = "$digest" ] || { echo "::error::o selo hml-ok de ${imagem} tem o digest ${selado}, e não o construído ${digest}"; exit 1; }
          done
          echo "aprovado em HML: ${COMMIT}"
          echo "  api     ${DIGEST_API}"
          echo "  console ${DIGEST_CONSOLE}"
