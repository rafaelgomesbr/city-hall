# PROMOÇÃO MANUAL para PRODUÇÃO (V2-F01-E12).
#
# PROD só muda por aqui, e só para uma versão que JÁ passou por HML. Este
# workflow não constrói nada: pega as MESMAS duas imagens (API e console) que o
# `deploy-hml.yml` construiu, copia-as por digest para o registro do Fly de PROD,
# implanta e confere `/saude` com a `versao` e o `commit` esperados. Só depois de
# API e console conferidos ele move o ramo `producao`, de onde a Vercel publica o
# painel de PROD (o painel novo não chega antes da API nova).
#
# COMO SE USA
#
#   GitHub > Actions > "Promover para PROD" > Run workflow (ramo master), com:
#     tag                  vX.Y.Z, a tag que o dono criou no commit (este workflow
#                          NUNCA cria tag)
#     sha                  o SHA de 40 caracteres desse commit, o mesmo que o
#                          `deploy-hml.yml` aprovou em HML
#     confirmacao          a frase `PROMOVER vX.Y.Z`, digitada
#     migracao_confirmada  marcada só se a migration de PROD já foi aplicada à
#                          mão (docs/runbooks/migracao.md) ou se não há nenhuma
#
# O QUE O PEDIDO PRECISA PROVAR (o job `validar` recusa se faltar qualquer um)
#
#   1. rodar a partir do ramo master (nunca de um ramo de prova);
#   2. a tag existe, aponta exatamente para o SHA, o SHA está no histórico da
#      master, e o nome da tag confere com a versão dos arquivos naquele commit;
#   3. a PROVA de HML, em três partes que se confirmam (a tag do GHCR sozinha
#      não basta, porque quem tem escrita no pacote consegue pôr uma tag):
#        a. pela API do Actions, existe um run do `deploy-hml.yml` com
#           `head_sha` igual ao SHA, evento `workflow_run`, conclusão `success`
#           e o job `aprovar` concluído com sucesso;
#        b. as DUAS imagens têm o selo `hml-ok-<sha>` e o digest dele é IGUAL ao
#           de `sha-<sha>` (a imagem construída é a aprovada);
#        c. cada digest tem atestação de proveniência assinada pelo
#           `deploy-hml.yml` deste repositório (`gh attestation verify
#           --signer-workflow`). SHA sem deploy bem-sucedido em HML é recusado;
#   4. a confirmação digitada é exatamente `PROMOVER <tag>`.
#
# A MIGRATION DE PROD NÃO É AUTOMÁTICA. A credencial de dono do banco de PROD não
# entra em CI (ADR 0008): `node scripts/migrar-producao.mjs --ambiente prod
# --aplicar`, da máquina do dono, com a cópia recente que o roteiro exige, ANTES
# de rodar este workflow. Se esquecer, o deploy da API falha sozinho: a partida
# recusa subir contra esquema atrasado e o release anterior segue atendendo.
#
# SEGREDOS (todos do AMBIENTE `producao`, que o dono configura com revisor
# obrigatório e restrito ao ramo master; nunca do repositório):
#
#   FLY_TOKEN_API       token de deploy do app de API de PROD, SÓ dele
#   FLY_TOKEN_CONSOLE   token de deploy do app de console de PROD, SÓ dele
#
# É o segredo mais sensível do CI. Nenhum token de HML entra aqui, e este arquivo
# não referencia o ambiente `homologacao`: o teste
# `scripts/conferir-workflows.test.mjs` confere os dois lados.
#
# PERMISSÕES: o topo só lê. O job `promover` precisa de `contents: write` para
# mover o ramo `producao` (é a única escrita em conteúdo, e o teste a trava
# neste job). O job `validar` não tem ambiente nem segredo e só LÊ: `actions:
# read` para consultar os runs do `deploy-hml.yml` e `packages: read` para o GHCR.
#
# Rollback: promover de novo uma versão anterior (as imagens e os selos ficam) ou
# o procedimento de docs/runbooks/rollback.md.

name: Promover para PROD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão, vX.Y.Z (criada pelo dono)"
        required: true
        type: string
      sha:
        description: "SHA completo (40 caracteres) do commit já aprovado em HML"
        required: true
        type: string
      confirmacao:
        description: "Digite PROMOVER seguido da tag (ex.: PROMOVER v0.1.0)"
        required: true
        type: string
      migracao_confirmada:
        description: "A migration de PROD já foi aplicada (ou não há nenhuma pendente)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Uma promoção de cada vez, nenhuma cancelada no meio.
concurrency:
  group: promover-producao
  cancel-in-progress: false

env:
  FLYCTL_VERSAO: "0.4.115"
  # SHA-256 de flyctl_0.4.115_Linux_x86_64.tar.gz, igual ao de
  # flyctl_0.4.115_checksums.txt do release oficial.
  FLYCTL_SHA256: "8b99a37a546c6c5b3ecb10c0c1d962c62b1cda328934f17c55180281cbdeb72f"
  # Os apps de PROD, os de `fly.toml` e `fly.console.toml`.
  APP_API: defesa-civil
  APP_CONSOLE: defesa-civil-console

jobs:
  validar:
    name: Validar o pedido de promoção
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      versao: ${{ steps.pedido.outputs.versao }}
      commit: ${{ steps.pedido.outputs.commit }}
      imagem_api: ${{ steps.selo.outputs.imagem_api }}
      imagem_console: ${{ steps.selo.outputs.imagem_console }}
      digest_api: ${{ steps.selo.outputs.digest_api }}
      digest_console: ${{ steps.selo.outputs.digest_console }}
    steps:
      # Falha de verdade (e não `if:` que pularia o job e deixaria o run verde).
      - name: Só a partir da master
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::a promoção só roda a partir do ramo master (este run é de $GITHUB_REF)"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # As entradas passam por `env`, nunca pela expressão dentro do script: o
      # texto digitado não vira comando.
      - name: Conferir tag, SHA, histórico e confirmação
        id: pedido
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
          MIGRACAO: ${{ inputs.migracao_confirmada }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "tag inválida (esperado vX.Y.Z)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "sha inválido (esperado 40 caracteres hexadecimais em minúsculas)"
          [ "$CONFIRMACAO" = "PROMOVER $TAG" ] || fail "confirmação diferente de 'PROMOVER $TAG'"
          [ "$MIGRACAO" = "true" ] || fail "migração de PROD não confirmada (docs/runbooks/migracao.md)"
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || fail "a tag $TAG não existe no repositório"
          [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA" ] || fail "a tag $TAG não aponta para o SHA informado"
          git merge-base --is-ancestor "$SHA" origin/master || fail "o SHA não está no histórico da master"
          git checkout --detach "$SHA"
          (cd dc360 && node scripts/versao.mjs conferir && node scripts/versao.mjs conferir-tag "$TAG")
          versao="$(cd dc360 && node scripts/versao.mjs mostrar | awk '/^plataforma:/ {print $2}')"
          [ "v$versao" = "$TAG" ] || fail "a versão dos arquivos ($versao) não é a da tag $TAG"
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"

      # Prova 3a: o deploy de HML deste SHA aconteceu de verdade. Consulta a API
      # do Actions (e não uma tag que alguém com escrita no pacote poderia pôr).
      # Sem segredo: só o GITHUB_TOKEN com `actions: read`.
      - name: Exigir um deploy de HML bem-sucedido para o SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.pedido.outputs.commit }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-hml.yml/runs?head_sha=${COMMIT}&event=workflow_run&per_page=100")"
          id="$(jq -r --arg sha "$COMMIT" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_run" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
          if [ -z "$id" ]; then
            echo "::error::não há run bem-sucedido do deploy-hml.yml (evento workflow_run) para o commit $COMMIT: ele não passou por um deploy em HML"
            exit 1
          fi
          # O run inteiro verde só vale se o último job (o selo) concluiu.
          aprovado="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" --jq '[.jobs[] | select(.name == "Marcar a versão como aprovada em HML" and .conclusion == "success")] | length')"
          [ "$aprovado" = "1" ] || { echo "::error::o run $id do deploy-hml.yml não concluiu o job de aprovação em HML"; exit 1; }
          echo "deploy de HML conferido: run $id"

      # Prova 3b e 3c. O selo `hml-ok-<sha>` tem de apontar para o MESMO digest de
      # `sha-<sha>` (a imagem que o workflow construiu), e esse digest tem de ter
      # proveniência assinada pelo `deploy-hml.yml` deste repositório. Sem as
      # duas imagens com tudo isso, a promoção é recusada, sem construir nada.
      - name: Exigir o selo, o digest igual e a atestação nas duas imagens
        id: selo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.pedido.outputs.commit }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          for alvo in api console; do
            imagem="$base/dc360-$alvo"
            digest="$(docker buildx imagetools inspect "$imagem:hml-ok-$COMMIT" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::o commit $COMMIT não tem o selo hml-ok na imagem $alvo: ele não passou por um deploy bem-sucedido em HML"
              exit 1
            fi
            construido="$(docker buildx imagetools inspect "$imagem:sha-$COMMIT" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [ "$digest" != "$construido" ]; then
              echo "::error::o selo hml-ok da imagem $alvo ($digest) não é o digest construído para o commit ($construido)"
              exit 1
            fi
            gh attestation verify "oci://$imagem@$digest" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy-hml.yml" \
              --deny-self-hosted-runners >/dev/null \
              || { echo "::error::a imagem $alvo ($digest) não tem atestação de proveniência assinada pelo deploy-hml.yml"; exit 1; }
            echo "imagem_$alvo=$imagem" >> "$GITHUB_OUTPUT"
            echo "digest_$alvo=$digest" >> "$GITHUB_OUTPUT"
            echo "$alvo aprovado em HML e atestado: $digest"
          done

  promover:
    name: Implantar API, console e painel em PROD
    needs: validar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A trava humana: o ambiente exige revisor e só aceita o ramo master.
    environment: producao
    permissions:
      contents: write
      packages: read
    env:
      VERSAO: ${{ needs.validar.outputs.versao }}
      COMMIT: ${{ needs.validar.outputs.commit }}
      IMAGEM_API: ${{ needs.validar.outputs.imagem_api }}
      IMAGEM_CONSOLE: ${{ needs.validar.outputs.imagem_console }}
      DIGEST_API: ${{ needs.validar.outputs.digest_api }}
      DIGEST_CONSOLE: ${{ needs.validar.outputs.digest_console }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validar.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Instalar o flyctl (versão fixa, SHA-256 conferido)
        run: |
          set -euo pipefail
          arquivo="flyctl_${FLYCTL_VERSAO}_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${arquivo}" \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSAO}/${arquivo}"
          echo "${FLYCTL_SHA256}  ${RUNNER_TEMP}/${arquivo}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/flyctl"
          tar -xzf "${RUNNER_TEMP}/${arquivo}" -C "${RUNNER_TEMP}/flyctl" flyctl
          echo "${RUNNER_TEMP}/flyctl" >> "$GITHUB_PATH"

      # Os apps têm de ser os de PROD, e as configurações as de PROD.
      - name: Conferir que os alvos são de PROD
        working-directory: dc360
        run: |
          set -euo pipefail
          grep -qx "app = \"${APP_API}\"" fly.toml
          grep -qx "app = \"${APP_CONSOLE}\"" fly.console.toml
          grep -Eq '^[[:space:]]*AMBIENTE_DC360 = "prod"' fly.toml
          case "$APP_API $APP_CONSOLE" in *hml*) echo "alvo de HML numa promoção para PROD"; exit 1 ;; esac

      # O ponto de volta e a linha de base do "tempo de troca". /saude é pública.
      - name: Registrar o /saude de antes
        run: |
          {
            echo "### /saude antes da promoção"
            echo '```'
            echo "api:     $(curl -fsS --max-time 15 "https://${APP_API}.fly.dev/saude" || echo 'sem resposta')"
            echo "console: $(curl -fsS --max-time 15 "https://${APP_CONSOLE}.fly.dev/saude" || echo 'sem resposta')"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          date +%s > "$RUNNER_TEMP/relogio"

      - name: Entrar no GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # A MESMA imagem de HML, por digest: o `imagetools create` copia o
      # manifesto entre registros sem reconstruir, então o digest em PROD é o
      # que HML ensaiou. O `/saude` com o commit esperado fecha a prova, e se não
      # ficar verde o job PARA aqui: nem o console nem o painel são tocados.
      - name: Implantar a API
        working-directory: dc360
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_API }}
        run: |
          set -euo pipefail
          printf '%s' "$FLY_API_TOKEN" | docker login registry.fly.io -u x --password-stdin
          docker buildx imagetools create --tag "registry.fly.io/${APP_API}:sha-${COMMIT}" "${IMAGEM_API}@${DIGEST_API}"
          flyctl deploy -c fly.toml -a "$APP_API" --image "registry.fly.io/${APP_API}@${DIGEST_API}"
          node scripts/conferir-saude-remota.mjs --tipo=api --url="https://${APP_API}.fly.dev" --versao="$VERSAO" --commit="$COMMIT"

      - name: Implantar o console
        working-directory: dc360
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_CONSOLE }}
        run: |
          set -euo pipefail
          printf '%s' "$FLY_API_TOKEN" | docker login registry.fly.io -u x --password-stdin
          docker buildx imagetools create --tag "registry.fly.io/${APP_CONSOLE}:sha-${COMMIT}" "${IMAGEM_CONSOLE}@${DIGEST_CONSOLE}"
          flyctl deploy -c fly.console.toml -a "$APP_CONSOLE" --ha=false --image "registry.fly.io/${APP_CONSOLE}@${DIGEST_CONSOLE}"
          node scripts/conferir-saude-remota.mjs --tipo=console --url="https://${APP_CONSOLE}.fly.dev" --versao="$VERSAO" --commit="$COMMIT"

      # Só agora o painel: o ramo `producao` é o que a Vercel de PROD publica.
      - name: Mover o ramo producao para o commit promovido
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Force porque promover uma versão mais antiga (voltar atrás) não é
          # avanço rápido. O ramo só é escrito por este passo.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/producao" -f sha="$COMMIT" -F force=true \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/producao" -f sha="$COMMIT"

      - name: Registrar o resultado
        if: success()
        run: |
          inicio="$(cat "$RUNNER_TEMP/relogio")"
          {
            echo "### Promoção concluída"
            echo "- versão: ${VERSAO}"
            echo "- commit: ${COMMIT}"
            echo "- API (digest): ${DIGEST_API}"
            echo "- console (digest): ${DIGEST_CONSOLE}"
            echo "- tempo de troca (API, console e ramo do painel): $(( $(date +%s) - inicio )) s"
            echo "- painel: confira na Vercel que o deploy do ramo producao está Ready"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sair dos registros
        if: always()
        run: |
          docker logout registry.fly.io || true
          docker logout ghcr.io || true
