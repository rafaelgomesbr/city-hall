# Portão de integração do DC360.
#
# O que ele impõe, e por quê:
#
# - Dependência com vulnerabilidade conhecida em runtime é bug, não pendência
#   (CLAUDE.md). Quem decide é `npm run auditar`, a política do CP-03 já
#   codificada, e não um `npm audit` cru. Ele roda no job `dependencias`, sozinho,
#   para a leitura job a job ficar limpa. O CP-03 está ABERTO e hoje o `auditar`
#   reprova por uma dependência de execução (`fastify`): job vermelho ali é o
#   resultado ESPERADO e correto, e não se mascara com `continue-on-error`.
# - O portão CA-06, de isolamento entre municípios, roda separado e primeiro.
#   É a regra número um do produto, e se ela quebrar nada mais importa.
# - Os números que o README afirma são conferidos contra a realidade.
#
# ESTE CI É PROVA DE EXECUÇÃO EM LINUX (docs/roadmap-v2/28-execucao-e-validacao.md,
# seções 6 e 8): o gatekeeper lê o run do SHA do commit candidato e avalia job a
# job, com artefato. Por isso:
#
# - Roda em push para main, master e para todo ramo `v2/**`, e em pull_request.
# - Em ramo `v2/**` nenhum run é cancelado nem substituído: cada SHA candidato
#   tem de ter o seu run completo (ver `concurrency`).
# - TODO job grava as saídas em arquivo e publica um artefato chamado
#   `<job>-<sha>`, retenção de 30 dias, mesmo quando falha. Em pull_request o
#   `github.sha` é o de um merge sintético: o commit candidato (a ponta do ramo)
#   vem escrito em `00-contexto.txt` de cada artefato.
# - Nenhum segredo entra em artefato: `scripts/ci-artefatos.sh redigir` limpa
#   URL com senha, JWT, Bearer e `PASSWORD '...'` antes de publicar (o baseline
#   já redige a própria saída e traz INDEX.md com SHA-256, por isso é pulado).
#
# Dois jobs só rodam em push (não em pull_request), porque são os mais longos e
# a prova que a política lê é a do run do commit candidato, que é de push:
# `baseline` e `restore`. Remover a linha `if:` deles os traz de volta ao PR.

name: Verificar

on:
  push:
    branches: [main, master, "v2/**"]
  pull_request:
  # `baseline` e `restore` sao os jobs longos (juntos, perto de uma hora).
  # Pela politica (docs/roadmap-v2/28-execucao-e-validacao.md, secao 14) o
  # kit completo roda no fechamento de gate e semanalmente, nao em todo
  # commit candidato: o gatekeeper dispara a mao (`gh workflow run`) no gate
  # e nas etapas com tag DB, MIGRATION ou RLS; a rodada semanal pega o resto.
  # `workflow_dispatch` e `schedule` so valem depois que este arquivo chega ao
  # ramo padrao; ate la (e tambem depois), um push cuja mensagem de commit
  # traga `[ci completo]` roda os dois jobs longos.
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

# Em main, master e pull_request, cancela a execução antiga do mesmo ramo:
# revisar resultado de commit que já foi substituído é desperdício de fila.
#
# Em `v2/**` é o contrário, e por dois motivos. `cancel-in-progress` é falso. E o
# grupo passa a incluir o SHA: sem isso o GitHub ainda descartaria o run PENDENTE
# mais antigo quando dois pushes chegam seguidos (a regra de concorrência mantém
# só um pendente por grupo), e um SHA candidato ficaria sem run.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/heads/v2/') && github.sha || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/v2/') }}

jobs:
  produto:
    name: Testes, tipos e scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        # `bash` explícito liga o `pipefail`: sem ele, `comando | tee arquivo`
        # devolveria o código do `tee` e esconderia a falha do comando.
        shell: bash
        working-directory: dc360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dc360/package-lock.json
            dc360/apps/campo/package-lock.json

      - name: Contexto do run
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" contexto "$RUNNER_TEMP/artefatos"

      # `npm ci` e não `npm install`: instalação reprodutível, a partir do
      # lockfile, sem atualizar nada por conta própria.
      - name: Instalar dependências
        id: instalar
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/artefatos/01-npm-ci.txt"

      # `apps/campo` fica fora do `workspaces`, com lockfile próprio. Vários
      # testes de `scripts/` leem `apps/campo/node_modules` (o plugin do mapa, os
      # entitlements) e SAEM SEM AFIRMAR NADA quando ele não existe. Sem esta
      # instalação o `test:scripts` passaria verde sem ter olhado o aplicativo.
      - name: Instalar dependências do aplicativo (os testes de scripts leem apps/campo/node_modules)
        id: instalar_app
        working-directory: dc360/apps/campo
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/artefatos/02-npm-ci-campo.txt"

      # Dai em diante cada passo roda mesmo que o anterior tenha falhado (desde
      # que a instalação tenha dado certo): o run de um SHA candidato deve
      # trazer TODAS as saídas, e não só a do primeiro vermelho. O job continua
      # vermelho se qualquer um falhar.
      - name: TypeScript estrito
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/artefatos/03-typecheck.txt"

      # Primeiro e sozinho: isolamento entre municípios é a regra número um.
      - name: Portão de isolamento (CA-06)
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run test:isolamento 2>&1 | tee "$RUNNER_TEMP/artefatos/04-isolamento.txt"

      - name: Suíte completa
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm test 2>&1 | tee "$RUNNER_TEMP/artefatos/05-suite-completa.txt"

      # Os testes de `scripts/` (baseline, portões de design e de acessibilidade
      # do aplicativo, paridades, migração, rotação de segredo). Até agora só
      # rodavam na máquina de quem desenvolve, e a portabilidade para Linux
      # ficou sem prova (E17, E21).
      - name: Testes dos scripts
        if: ${{ !cancelled() && steps.instalar_app.outcome == 'success' }}
        run: npm run test:scripts 2>&1 | tee "$RUNNER_TEMP/artefatos/06-test-scripts.txt"

      - name: Os números do README batem com a realidade
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run conferir:numeros 2>&1 | tee "$RUNNER_TEMP/artefatos/07-conferir-numeros.txt"

      - name: Redigir segredo dos artefatos
        if: ${{ always() }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" redigir "$RUNNER_TEMP/artefatos"

      - name: Publicar os artefatos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: produto-${{ github.sha }}
          path: ${{ runner.temp }}/artefatos
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  dependencias:
    # A política do CP-03 (alternativa B), codificada em `scripts/auditar.mjs`:
    # vulnerabilidade em dependência de runtime reprova; em ferramenta de
    # desenvolvimento aparece e não reprova; o aplicativo de campo é auditado
    # contra uma lista nomeada (`ACEITAS_NO_APLICATIVO`). Substitui os dois
    # `npm audit` crus que ficavam nos jobs `produto` e `aplicativo`.
    #
    # Job próprio de propósito: a leitura job a job fica limpa (vermelho aqui
    # quer dizer só "há dependência vulnerável") e nenhum outro passo espera
    # por ele. Não instala nada: `npm audit` lê o `package-lock.json`.
    #
    # VERMELHO HOJE É O ESPERADO enquanto o CP-03 estiver aberto (o `fastify`
    # de execução). Não pôr `continue-on-error`.
    name: Dependências com vulnerabilidade conhecida (auditar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: dc360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Contexto do run
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" contexto "$RUNNER_TEMP/artefatos"

      - name: Política de dependências (npm run auditar)
        run: npm run auditar 2>&1 | tee "$RUNNER_TEMP/artefatos/01-auditar.txt"

      # Evidência, e não portão: os relatórios brutos que o `auditar` lê, para o
      # validador conferir a política contra os dados. O `|| true` é daqui, e
      # só daqui: o passo acima é quem decide.
      - name: Relatórios brutos do npm audit (evidência, não decide nada)
        if: ${{ always() }}
        run: |
          npm audit --json > "$RUNNER_TEMP/artefatos/02-audit-raiz.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/artefatos/03-audit-raiz-runtime.json" || true
          (cd apps/campo && npm audit --json > "$RUNNER_TEMP/artefatos/04-audit-campo.json") || true
          (cd apps/campo && npm audit --omit=dev --json > "$RUNNER_TEMP/artefatos/05-audit-campo-runtime.json") || true

      - name: Redigir segredo dos artefatos
        if: ${{ always() }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" redigir "$RUNNER_TEMP/artefatos"

      - name: Publicar os artefatos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependencias-${{ github.sha }}
          path: ${{ runner.temp }}/artefatos
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  roadmap:
    # As ferramentas do sistema de validação (D-30, `scripts/roadmap/`) e o
    # alarme de drift do estado: `gerar-estado --conferir` reprova quando o
    # `ESTADO-ATUAL.md` não bate com o STATUS, quando o STATUS cita commit que
    # não existe ou quando uma etapa afirma mais do que o VEREDITO prova.
    # Histórico completo (`fetch-depth: 0`) porque a conferência resolve os
    # commits citados. Sem `npm ci`: as ferramentas não têm dependência; o
    # teste de PDF se pula sozinho quando não há Chromium.
    name: Ferramentas do roadmap e estado gerado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Contexto do run
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" contexto "$RUNNER_TEMP/artefatos"

      - name: Testes das ferramentas (node --test)
        run: node --test "scripts/roadmap/*.test.mjs" 2>&1 | tee "$RUNNER_TEMP/artefatos/01-testes-roadmap.txt"

      - name: Estado gerado confere com o repositório
        if: ${{ !cancelled() }}
        run: node scripts/roadmap/gerar-estado.mjs --conferir 2>&1 | tee "$RUNNER_TEMP/artefatos/02-estado-conferir.txt"

      - name: Redigir segredo dos artefatos
        if: ${{ always() }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" redigir "$RUNNER_TEMP/artefatos"

      - name: Publicar os artefatos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-${{ github.sha }}
          path: ${{ runner.temp }}/artefatos
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  navegador:
    name: Fluxo ponta a ponta no navegador
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: dc360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dc360/package-lock.json

      - name: Contexto do run
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" contexto "$RUNNER_TEMP/artefatos"

      - name: Instalar dependências
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/artefatos/01-npm-ci.txt"

      # Chromium é o motor do Chrome e do Edge; Firefox é o segundo motor que o
      # critério de aceite exige. `--with-deps` traz as bibliotecas de sistema
      # que faltam numa imagem limpa.
      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium firefox 2>&1 | tee "$RUNNER_TEMP/artefatos/02-playwright-install.txt"

      - name: Construir o painel
        run: npm run build --workspace @dc360/web 2>&1 | tee "$RUNNER_TEMP/artefatos/03-build-do-painel.txt"

      # `nohup` porque o processo precisa sobreviver ao fim deste passo, e
      # espera por resposta de verdade em vez de `sleep`: dormir um número
      # inventado de segundos é como testes ficam intermitentes.
      - name: Servir o painel
        run: nohup npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
        working-directory: dc360/apps/web

      - name: Esperar o painel responder
        id: esperar
        run: |
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4173; then
              echo "painel de pé"
              exit 0
            fi
            sleep 1
          done
          echo "o painel não respondeu em 60 segundos"
          cat /tmp/preview.log
          exit 1

      - name: Modo local, no Chromium
        run: npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/artefatos/04-e2e-local-chromium.txt"

      # Os dois passos seguintes rodam mesmo se o Chromium falhar, para o run
      # do SHA trazer a saída de todos os motores.
      - name: Modo local, no Firefox
        if: ${{ !cancelled() && steps.esperar.outcome == 'success' }}
        run: MOTOR=firefox npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/artefatos/05-e2e-local-firefox.txt"

      # O CAMINHO DE PRODUÇÃO. Este passo é o mais importante do arquivo.
      #
      # Ele ficou fora daqui desde sempre, e o preço apareceu duas vezes: uma
      # correção de segurança tirou o link de redefinição do log, que era de
      # onde a suíte o lia, e quase metade das verificações deixou de ser
      # alcançada sem ninguém ver. Antes disso, a interceptação de rede da
      # seção 19 apontava para uma porta fixa e era linha morta ao lado de
      # outra linha morta.
      #
      # As verificações do modo local acima rodam o modo de demonstração. Só as
      # daqui passam por autenticação real, CORS, renovação de sessão, upload de
      # evidência e documento saindo do servidor. Verde sem elas é verde que não
      # cobre o que vai a produção. (Quantas são cada uma, quem diz é a saída
      # arquivada, `Passou: N   Falhou: 0`; contagem escrita aqui envelhece.)
      #
      # O script sobe API e painel do zero em portas próprias: a suíte confere
      # protocolo por número e a detecção de duplicidade recusa o segundo
      # registro no mesmo endereço, então instância suja reprova.
      - name: Caminho de produção, contra a API
        if: ${{ !cancelled() && steps.esperar.outcome == 'success' }}
        run: npm run test:e2e:api 2>&1 | tee "$RUNNER_TEMP/artefatos/06-e2e-contra-a-api.txt"

      - name: Registro do servidor de pré-visualização
        if: ${{ always() }}
        run: cp /tmp/preview.log "$RUNNER_TEMP/artefatos/07-preview.log" || true

      - name: Redigir segredo dos artefatos
        if: ${{ always() }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" redigir "$RUNNER_TEMP/artefatos"

      - name: Publicar os artefatos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: navegador-${{ github.sha }}
          path: ${{ runner.temp }}/artefatos
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  demonstracao:
    name: Pacote da demonstração
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dc360/package-lock.json

      - name: Contexto do run
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" contexto "$RUNNER_TEMP/artefatos"

      - name: Instalar dependências
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/artefatos/01-npm-ci.txt"
        working-directory: dc360

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium firefox 2>&1 | tee "$RUNNER_TEMP/artefatos/02-playwright-install.txt"
        working-directory: dc360

      # O empacotador é PowerShell, que existe no runner do Ubuntu como `pwsh`.
      - name: Montar o pacote
        shell: pwsh
        run: ./scripts/empacotar-demo.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/artefatos/03-empacotar.txt"

      # O SHA-256 do zip vai no artefato: o validador confere que o pacote
      # extraído abaixo é o que foi montado.
      - name: Extrair como o destinatário faz
        id: extrair
        run: |
          mkdir -p /tmp/pacote
          unzip -q dist/DefesaCivil360-demonstracao.zip -d /tmp/pacote
          sha256sum dist/DefesaCivil360-demonstracao.zip | tee "$RUNNER_TEMP/artefatos/04-sha256-do-pacote.txt"

      - name: Conferir o pacote extraído
        run: node scripts/conferir-pacote.mjs /tmp/pacote 2>&1 | tee "$RUNNER_TEMP/artefatos/05-conferir-pacote.txt"

      - name: Roteiro de dez minutos, Chromium
        run: node scripts/conferir-roteiro.mjs /tmp/pacote chromium 2>&1 | tee "$RUNNER_TEMP/artefatos/06-roteiro-chromium.txt"

      # Roda mesmo se o Chromium falhar, para o run trazer os dois motores.
      - name: Roteiro de dez minutos, Firefox
        if: ${{ !cancelled() && steps.extrair.outcome == 'success' }}
        run: node scripts/conferir-roteiro.mjs /tmp/pacote firefox 2>&1 | tee "$RUNNER_TEMP/artefatos/07-roteiro-firefox.txt"

      - name: Redigir segredo dos artefatos
        if: ${{ always() }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" redigir "$RUNNER_TEMP/artefatos"

      - name: Publicar os artefatos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: demonstracao-${{ github.sha }}
          path: ${{ runner.temp }}/artefatos
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  aplicativo:
    name: Aplicativo de campo
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: dc360/apps/campo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dc360/package-lock.json
            dc360/apps/campo/package-lock.json

      - name: Contexto do run
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" contexto "$RUNNER_TEMP/artefatos"

      # Os pacotes compartilhados entram por link e precisam estar compilados:
      # o aplicativo consome o `dist`, não o TypeScript de origem.
      - name: Compilar os pacotes compartilhados
        run: |
          { npm ci && npm run build --workspace @dc360/shared && npm run build --workspace @dc360/campo; } 2>&1 | tee "$RUNNER_TEMP/artefatos/01-npm-ci-e-build-dos-compartilhados.txt"
        working-directory: dc360

      - name: Instalar dependências do aplicativo
        id: instalar_app
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/artefatos/02-npm-ci-campo.txt"

      - name: TypeScript estrito
        if: ${{ !cancelled() && steps.instalar_app.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/artefatos/03-typecheck.txt"

      # O aplicativo passou a ter teste. Antes deste passo, o job media só
      # higiene de dependência: TypeScript limpo, Expo saudável e audit em
      # zero. Nenhuma das três enxerga comportamento, e a corrida de renovação
      # que derrubava a sessão do agente no meio do campo passava nas três.
      - name: Testes do aplicativo
        if: ${{ !cancelled() && steps.instalar_app.outcome == 'success' }}
        run: npm test 2>&1 | tee "$RUNNER_TEMP/artefatos/04-jest.txt"

      # O comando da raiz que mede o aplicativo: tipos, jest e a conferência de
      # que o jest executou exatamente os casos que a leitura do código conta.
      # Repete o typecheck e o jest dos dois passos acima de propósito: aqui o
      # que vale é o cruzamento das contagens e a regra de que a falta de
      # dependência reprova em vez de pular. (Se o tempo do job pesar, este
      # passo pode substituir aqueles dois.)
      - name: Comando da raiz que mede o aplicativo (test:campo)
        if: ${{ !cancelled() && steps.instalar_app.outcome == 'success' }}
        working-directory: dc360
        run: npm run test:campo 2>&1 | tee "$RUNNER_TEMP/artefatos/05-test-campo.txt"

      # A ÁRVORE DE DEPENDÊNCIA PRECISA SER COERENTE.
      #
      # Este é o portão que teria pego o defeito que impediu o aplicativo de
      # compilar: o `expo-router` puxava `react-native-worklets@0.12.1` e o
      # `expo-modules-core` aceita no máximo `0.10`. O npm já imprimia
      # `invalid` ao lado do pacote, e ninguém lia. O erro só apareceu seis
      # minutos build adentro, em compilação C++.
      #
      # `npm ls` sai com código diferente de zero quando a árvore é
      # incoerente, então basta chamá-lo.
      - name: Árvore de dependência coerente
        if: ${{ !cancelled() && steps.instalar_app.outcome == 'success' }}
        run: npm ls 2>&1 | tee "$RUNNER_TEMP/artefatos/06-npm-ls.txt"

      # Verificações da própria Expo: configuração de plugin, arquivo de
      # projeto conflitante, compatibilidade com o SDK.
      #
      # A checagem de versão de pacote fica DE FORA, e é decisão consciente.
      # Ela consulta a rede e reprova quando a Expo publica qualquer patch, o
      # que acontece toda semana: o resultado é integração contínua vermelha
      # por motivo que não é nosso, e time que aprende a ignorar vermelho.
      #
      # Não é perda de cobertura real: essa checagem só olha dependência
      # DIRETA, e o defeito do worklets era transitivo. Quem cobre isso é o
      # passo acima. Atualizar patch da Expo continua sendo trabalho de
      # manutenção, e ele tem lugar: a conferência trimestral do LOJAS.md.
      - name: Saúde do projeto Expo
        if: ${{ !cancelled() && steps.instalar_app.outcome == 'success' }}
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
        run: npx expo-doctor 2>&1 | tee "$RUNNER_TEMP/artefatos/07-expo-doctor.txt"

      # O `npm audit` cru que ficava aqui saiu: `npm run auditar` (job
      # `dependencias`) já audita `apps/campo` contra a lista nomeada
      # `ACEITAS_NO_APLICATIVO`.

      - name: Redigir segredo dos artefatos
        if: ${{ always() }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" redigir "$RUNNER_TEMP/artefatos"

      - name: Publicar os artefatos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-${{ github.sha }}
          path: ${{ runner.temp }}/artefatos
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  implantavel:
    # O job que faltava, e o que os auditores disseram valer mais que qualquer
    # outro se fosse um só: prova que a API SOBE contra Postgres real, com o
    # modelo de tres papeis, e responde /saude com 200. Nenhum dos testes da
    # suite pega isto, porque todos rodam em PGlite como superusuario, onde
    # permissao nunca e negada. Foi assim que "a API nao sobe contra Postgres
    # nenhum" sobreviveu a suite inteira ate a auditoria achar a mao.
    name: A API sobe contra Postgres real
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: dc360

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dc360/package-lock.json

      - name: Contexto do run
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" contexto "$RUNNER_TEMP/artefatos"

      - name: Instalar dependencias
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/artefatos/01-npm-ci.txt"

      - name: Construir shared, db e api
        run: |
          npm run build --workspace @dc360/shared
          npm run build --workspace @dc360/db
          npm run build --workspace @dc360/api

      # Os TRES papeis do README, provados: setup (CREATEROLE + BYPASSRLS)
      # cria e migra; a aplicacao conecta com um login restrito, membro de
      # dc360_app, que nao e superusuario nem dono.
      #
      # O `GRANT CREATE ON DATABASE` e o que faltava. A migracao 041 cria a
      # extensao `pg_trgm`; ela e extensao CONFIAVEL (qualquer papel pode
      # cria-la), mas "confiavel" exige o privilegio CREATE no banco, e um banco
      # criado pelo `postgres` nao o da ao `dc360_setup`. Sem esta linha a 041
      # para com `permission denied to create extension "pg_trgm"`, e o job
      # ficava vermelho desde que a 041 existe (achado da V2-F00-E25, provado
      # no Postgres 18). Preferido a `CREATE DATABASE ... OWNER dc360_setup`
      # porque e a receita que o README e o roteiro de restore ja descrevem, e
      # porque num Postgres gerenciado o banco ja existe e o dono nao se troca:
      # ali o que se pode fazer e conceder.
      - name: Provisionar papeis e banco
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          {
            psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE dc360;"
            psql -v ON_ERROR_STOP=1 -d dc360 -c "CREATE ROLE dc360_setup LOGIN PASSWORD 'setup' CREATEROLE BYPASSRLS NOSUPERUSER;"
            psql -v ON_ERROR_STOP=1 -d dc360 -c "ALTER SCHEMA public OWNER TO dc360_setup;"
            psql -v ON_ERROR_STOP=1 -d dc360 -c "GRANT ALL ON SCHEMA public TO dc360_setup;"
            psql -v ON_ERROR_STOP=1 -d dc360 -c "GRANT CREATE ON DATABASE dc360 TO dc360_setup;"
            psql -v ON_ERROR_STOP=1 -d dc360 -c "CREATE ROLE dc360_api LOGIN PASSWORD 'api' NOSUPERUSER;"
          } 2>&1 | tee "$RUNNER_TEMP/artefatos/02-provisionar.txt"

      - name: Migrar com o papel de setup
        run: DATABASE_URL=postgres://dc360_setup:setup@localhost:5432/dc360 npm run migrar 2>&1 | tee "$RUNNER_TEMP/artefatos/03-migrar.txt"
      - name: Migrar de novo e provar idempotencia
        run: DATABASE_URL=postgres://dc360_setup:setup@localhost:5432/dc360 npm run migrar -- --conferir 2>&1 | tee "$RUNNER_TEMP/artefatos/04-migrar-conferir.txt"

      - name: Conceder a associacao ao login de aplicacao
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -d dc360 -c "GRANT dc360_app TO dc360_api WITH SET TRUE;" 2>&1 | tee "$RUNNER_TEMP/artefatos/05-conceder.txt"

      # Sobe a API com o papel de APLICACAO (restrito) e prova /saude=200.
      # Se o CREATE TABLE voltar ao caminho de leitura, ou o papel perder a
      # associacao, este passo falha aqui, e nao em producao.
      - name: A API sobe como aplicacao e responde /saude
        env:
          NODE_ENV: development
          HOST: 127.0.0.1
          PORT: "3333"
          DATABASE_URL: postgres://dc360_api:api@localhost:5432/dc360
          JWT_SEGREDO: segredo-de-ci-com-pelo-menos-trinta-e-dois-bytes
        run: |
          node apps/api/dist/index.js > "$RUNNER_TEMP/artefatos/06-api.log" 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          subiu=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3333/saude > "$RUNNER_TEMP/artefatos/07-saude.json"; then subiu=1; break; fi
            sleep 1
          done
          if [ "$subiu" != "1" ]; then
            echo "a API nao respondeu /saude 200 em 30 segundos"
            tail -n 40 "$RUNNER_TEMP/artefatos/06-api.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/artefatos/07-saude.json"
          node -e "const s=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); process.exit(s.status==='ok'&&s.banco==='ok'?0:1)" "$RUNNER_TEMP/artefatos/07-saude.json"

      - name: Redigir segredo dos artefatos
        if: ${{ always() }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" redigir "$RUNNER_TEMP/artefatos"

      - name: Publicar os artefatos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: implantavel-${{ github.sha }}
          path: ${{ runner.temp }}/artefatos
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  baseline:
    # O roteiro da linha de base (`scripts/baseline.mjs`, V2-F00-E01) em Linux:
    # instala as duas árvores do zero, roda cada comando da fase e compara o
    # resultado com o esperado. O artefato é a pasta inteira que o roteiro grava
    # (RESUMO.md, INDEX.md com SHA-256, resultados.json e a saída de cada passo,
    # já redigida pelo próprio roteiro).
    #
    # COMO LER O RESULTADO. O baseline sai com código 0 quando todo passo
    # "confere", 1 quando algum fica "divergente", e 2 quando o próprio roteiro
    # quebra (opção inválida, pasta ilegível). Este job:
    #   - FALHA se o roteiro quebrar (código 2 ou outro), se faltar arquivo de
    #     resultado ou se o número de resultados não bater com o de passos;
    #   - PASSA, com aviso, se só houver divergência. Divergência não é falha de
    #     roteiro: quem a avalia é o validador, lendo `RESUMO.md` e
    #     `resultados.json` do artefato (um passo esperado vermelho que ficou
    #     verde, ou o contrário, é achado a explicar, e não motivo para o job
    #     derrubar o CI por si só).
    #
    # Dois passos merecem atenção. O `expo-doctor` e os dois `npm audit` dependem
    # de rede e da base de avisos do dia, e o roteiro os espera vermelhos (20 de
    # 21 verificações; avisos abertos): a divergência neles é esperada de tempos
    # em tempos e aparece no RESUMO. O `auditar` também é esperado vermelho
    # enquanto o CP-03 estiver aberto.
    #
    # Só em push (ver o comentário do topo): é o job mais longo.
    name: Linha de base (baseline.mjs) em Linux
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci completo]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: dc360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dc360/package-lock.json
            dc360/apps/campo/package-lock.json

      - name: Contexto do run
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" contexto "$RUNNER_TEMP/artefatos"

      # O baseline faz o próprio `npm ci` nas duas árvores (é o primeiro passo do
      # roteiro, e entra no RESUMO). Este, antes dele, existe só para o
      # `npx playwright install` achar o pacote: o roteiro apaga e reinstala
      # `node_modules`, e os navegadores ficam em `~/.cache/ms-playwright`, fora
      # dele.
      - name: Instalar dependências (só para o Playwright achar o instalador)
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/artefatos/01-npm-ci-previo.txt"

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium firefox 2>&1 | tee "$RUNNER_TEMP/artefatos/02-playwright-install.txt"

      - name: Roteiro da linha de base
        id: baseline
        run: |
          pasta="$RUNNER_TEMP/artefatos/baseline"
          set +e +o pipefail
          node scripts/baseline.mjs "--saida=$pasta" 2>&1 | tee "$RUNNER_TEMP/artefatos/03-baseline-stdout.txt"
          codigo=${PIPESTATUS[0]}
          set -e -o pipefail
          echo "o baseline saiu com código $codigo"

          if [ "$codigo" -ne 0 ] && [ "$codigo" -ne 1 ]; then
            echo "::error title=baseline quebrou::o roteiro saiu com código $codigo (0 confere, 1 divergente, outro é falha do roteiro)"
            exit 1
          fi
          for f in RESUMO.md INDEX.md resultados.json; do
            if [ ! -s "$pasta/$f" ]; then
              echo "::error title=baseline quebrou::faltou $pasta/$f"
              exit 1
            fi
          done
          esperados="$(node scripts/baseline.mjs --so-listar | wc -l | tr -d ' ')"
          obtidos="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).length)" "$pasta/resultados.json")"
          if [ "$esperados" != "$obtidos" ]; then
            echo "::error title=baseline quebrou::o roteiro tem $esperados passos e o resultado traz $obtidos"
            exit 1
          fi
          if [ "$codigo" -eq 1 ]; then
            echo "::warning title=baseline com divergência::há passo divergente do esperado. A avaliação é do validador, pelo RESUMO.md e resultados.json do artefato."
          fi

      - name: Resumo do baseline na página do run
        if: ${{ always() }}
        run: |
          if [ -s "$RUNNER_TEMP/artefatos/baseline/RESUMO.md" ]; then
            cat "$RUNNER_TEMP/artefatos/baseline/RESUMO.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      # SEM redigir `baseline/`: o roteiro já redige a própria saída, e o
      # INDEX.md dele guarda o SHA-256 de cada arquivo, que reescrever depois
      # invalidaria. Os demais arquivos do artefato são redigidos normalmente.
      - name: Redigir segredo dos artefatos (menos a pasta do baseline)
        if: ${{ always() }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" redigir "$RUNNER_TEMP/artefatos" baseline

      - name: Publicar os artefatos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ github.sha }}
          path: ${{ runner.temp }}/artefatos
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  restore:
    # O roteiro de `dc360/docs/RESTORE-DO-BANCO.md` (V2-F00-E25, critério CA-08),
    # em Linux e no Postgres 17, que é a versão da produção. Dois servidores
    # PostgreSQL 17 novos, cada um num contêiner (a origem e o destino do dump),
    # com senhas geradas neste job: migra do zero, semeia, despeja, restaura com
    # `--exit-on-error` e confere linhas, estrutura, RLS ativada e forçada,
    # isolamento e a API contra a cópia. A lógica está em
    # `scripts/ensaiar-restore.sh`, que roda igual fora do CI (basta ter dois
    # servidores novos).
    #
    # Dois contêineres, e não dois bancos no mesmo servidor, porque papel de
    # banco é do servidor inteiro: com um servidor só, os papéis da origem já
    # existiriam no destino e o roteiro (criar os papéis ANTES do restore) não
    # seria reproduzido.
    #
    # O cliente (`pg_dump`, `psql`) é o 17, instalado do repositório oficial do
    # PostgreSQL: o do runner é o 16, e `pg_dump` mais velho que o servidor
    # recusa trabalhar.
    #
    # Só em push (ver o comentário do topo).
    name: Restore do banco, Postgres 17 (CA-08)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci completo]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: dc360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dc360/package-lock.json

      - name: Contexto do run
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" contexto "$RUNNER_TEMP/artefatos"

      - name: Instalar dependências
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/artefatos/01-npm-ci.txt"

      - name: Construir shared, db e api
        run: |
          {
            npm run build --workspace @dc360/shared
            npm run build --workspace @dc360/db
            npm run build --workspace @dc360/api
          } 2>&1 | tee "$RUNNER_TEMP/artefatos/02-build.txt"

      - name: Instalar o cliente PostgreSQL 17
        run: |
          {
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y -qq postgresql-client-17
            /usr/lib/postgresql/17/bin/pg_dump --version
          } 2>&1 | tee "$RUNNER_TEMP/artefatos/03-cliente-postgresql-17.txt"

      # A senha do superusuário dos dois servidores nasce aqui, é mascarada no
      # log e vai ao restante do job pelo ambiente. Não é gravada em arquivo
      # de saída. As senhas dos papéis dc360_* nascem dentro do roteiro.
      - name: Gerar a senha descartável do superusuário
        run: |
          senha="$(node -e "process.stdout.write(require('crypto').randomBytes(18).toString('base64url'))")"
          echo "::add-mask::$senha"
          echo "SENHA_DO_JOB=$senha" >> "$GITHUB_ENV"

      # Os dois servidores, iniciados como o roteiro (passo 1) manda: UTF8 e
      # locale C, autenticação por senha. `-e POSTGRES_PASSWORD` sem valor herda
      # do ambiente, e a senha não vai na linha de comando.
      - name: Subir os dois servidores PostgreSQL 17
        run: |
          {
            for par in origem:55451 destino:55452; do
              nome="${par%%:*}"
              porta="${par##*:}"
              POSTGRES_PASSWORD="$SENHA_DO_JOB" docker run -d --name "dc360-pg-$nome" \
                -e POSTGRES_PASSWORD \
                -e POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=C" \
                -p "127.0.0.1:$porta:5432" postgres:17
            done
            docker ps --filter name=dc360-pg- --format '{{.Names}} {{.Image}} {{.Ports}}'
          } 2>&1 | tee "$RUNNER_TEMP/artefatos/04-servidores.txt"

      - name: Ensaiar o restore
        env:
          PORTA_ORIGEM: "55451"
          PORTA_DESTINO: "55452"
          SAIDA: ${{ runner.temp }}/artefatos/restore
          PGBIN: /usr/lib/postgresql/17/bin
        run: SENHA_SUPERUSUARIO="$SENHA_DO_JOB" bash scripts/ensaiar-restore.sh 2>&1 | tee "$RUNNER_TEMP/artefatos/05-ensaio-do-restore.txt"

      - name: Registro dos servidores e limpeza
        if: ${{ always() }}
        run: |
          for nome in origem destino; do
            docker logs "dc360-pg-$nome" > "$RUNNER_TEMP/artefatos/06-servidor-$nome.log" 2>&1 || true
            docker rm -f "dc360-pg-$nome" > /dev/null 2>&1 || true
          done

      - name: Redigir segredo dos artefatos
        if: ${{ always() }}
        run: bash "$GITHUB_WORKSPACE/dc360/scripts/ci-artefatos.sh" redigir "$RUNNER_TEMP/artefatos"

      - name: Publicar os artefatos
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: restore-${{ github.sha }}
          path: ${{ runner.temp }}/artefatos
          retention-days: 30
          overwrite: true
          if-no-files-found: error
